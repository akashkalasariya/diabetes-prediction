<!DOCTYPE html>
<html>
<head>
    <title>Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            font-family: 'Segoe UI';
        }

        .container-box {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            animation: fadeIn 1.5s ease-in;
        }

        input {
            margin-bottom: 10px;
        }

        small {
            color: #ddd;
        }

        @keyframes fadeIn {
            from {opacity:0; transform: translateY(30px);}
            to {opacity:1; transform: translateY(0);}
        }

        .btn-custom {
            background: #00c6ff;
            border: none;
        }

        .btn-custom:hover {
            background: #0072ff;
        }
    </style>
</head>

<body>

<div class="container-box">

    <h3 class="text-center mb-3">🧾 Enter Details</h3>

    <form method="POST">

        <input class="form-control" type="text" name="name" placeholder="Name" required>

        <input class="form-control" type="number" name="Pregnancies" placeholder="Pregnancies" required>
        <small>0–15</small>

        <input class="form-control" type="number" name="Glucose" placeholder="Glucose" required>
        <small>70–99 normal</small>

        <input class="form-control" type="number" name="BloodPressure" placeholder="Blood Pressure" required>
        <small>~80 normal</small>

        <input class="form-control" type="number" name="SkinThickness" placeholder="Skin Thickness" required>
        <small>10–50</small>

        <input class="form-control" type="number" name="Insulin" placeholder="Insulin" required>
        <small>15–276</small>

        <input class="form-control" type="number" step="any" name="BMI" placeholder="BMI" required>
        <small>18–25 normal</small>

        <input class="form-control" type="number" step="any" name="DiabetesPedigreeFunction" placeholder="DPF" required>
        <small>0.1–2.5</small>

        <input class="form-control" type="number" name="Age" placeholder="Age" required>
        <small>18–80</small>

        <button class="btn btn-custom w-100 mt-3">Predict</button>

    </form>

    {% if result %}
        <div class="alert alert-info mt-3 text-center">{{ result }}</div>
    {% endif %}

    {% if error %}
        <div class="alert alert-danger mt-3 text-center">{{ error }}</div>
    {% endif %}

</div>

</body>
</html>
