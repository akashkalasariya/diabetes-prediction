<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Predictor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            font-family: 'Segoe UI';
        }

        .navbar {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .hero {
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .glass {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from {opacity:0; transform: translateY(30px);}
            to {opacity:1; transform: translateY(0);}
        }

        .btn-custom {
            background: #00c6ff;
            border: none;
            color: white;
        }

        .btn-custom:hover {
            background: #0072ff;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand" href="#">🧠 Diabetes AI</a>
</nav>

<!-- Hero Section -->
<div class="hero">
    <div class="glass">

        <h1><i class="fas fa-heartbeat"></i> Smart Diabetes Prediction</h1>

        <p class="mt-3">
            This AI-powered system predicts diabetes risk based on medical inputs.
            <br>
            Early detection = Better life ❤️
        </p>

        <form action="/predict">
            <button class="btn btn-custom mt-3">Start Prediction 🚀</button>
        </form>

    </div>
</div>

</body>
</html>
